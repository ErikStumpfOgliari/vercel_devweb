version: '3.9'

services:
  db:
    image: postgres:15-alpine
    container_name: soloobra_db
    environment:
      POSTGRES_DB: SoloObraDB
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5434:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: soloobra_api
    depends_on:
      - db
    ports:
      - "5000:5000"
    env_file:
      - .env.docker
    environment:
      PGHOST: db
      PG_PORT: 5432
      PG_DATABASE: SoloObraDB
      PG_USER: postgres
      PG_PASSWORD: postgres
      JWT_SECRET: soloobra-docker-secret

volumes:
  db_data:
